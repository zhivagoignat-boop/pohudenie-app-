name: AI Auto PR (OpenRouter)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Что сделать"
        required: true
        type: string
      target_file:
        description: "Файл для изменения"
        required: true
        default: "README.md"
        type: string
      model:
        description: "Модель OpenRouter"
        required: true
        default: "openai/gpt-4o-mini"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Echo inputs
        run: |
          echo "Task: ${{ github.event.inputs.task }}"
          echo "Target: ${{ github.event.inputs.target_file }}"
          echo "Model: ${{ github.event.inputs.model }}"
