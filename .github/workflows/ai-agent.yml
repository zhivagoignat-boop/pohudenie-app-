name: AI Agent (Issue/Comment -> PR)

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai_fix:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '/ai fix ')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/ai fix '))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse command
        id: parse
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python - << 'PY'
          import os

          event = os.getenv("EVENT_NAME","")
          issue_title = os.getenv("ISSUE_TITLE","").strip()
          issue_body = os.getenv("ISSUE_BODY","").strip()
          comment_body = os.getenv("COMMENT_BODY","").strip()

          target_file = ""
          task = ""

          if event == "issues":
              # title format: /ai fix README.md
              target_file = issue_title.replace("/ai fix", "", 1).strip()
              task = issue_body if issue_body else "Update the target file per best practices."
          elif event == "issue_comment":
              lines = comment_body.splitlines()
              cmd = lines[0].strip() if lines else ""
              target_file = cmd
